# Runs the University Management System with a PostgreSQL database.
#   docker compose up --build
# Values come from a .env file next to this one (copy .env.example to .env),
# falling back to the defaults below.

services:
  db:
    image: postgres:17-alpine
    container_name: ums-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ums}
      POSTGRES_USER: ${POSTGRES_USER:-ums}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ums_password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: university-management-system:latest
    container_name: ums-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-9090}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ums}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ums}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ums_password}
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-please-change-0123456789abcdef}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT1H}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@university.edu}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}

volumes:
  db-data:
