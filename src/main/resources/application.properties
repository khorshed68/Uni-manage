spring.application.name=university-management-system
server.port=${SERVER_PORT:9090}

# ---------------------------------------------------------------------------
# Database
# Defaults to an in-memory H2 database so the app runs locally with no setup.
# Docker Compose overrides these with PostgreSQL (see compose.yaml).
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ums;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# HMAC key used to sign JWTs; at least 32 characters. ALWAYS override JWT_SECRET outside local dev.
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.jwt.issuer=university-management-system

# First admin, created only when the database has no admin yet.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.email=${ADMIN_EMAIL:admin@university.edu}

# Adds demo users teacher1 / Teacher@123 and student1 / Student@123 on startup.
app.seed-demo-data=${SEED_DEMO_DATA:true}

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.error.include-message=never
